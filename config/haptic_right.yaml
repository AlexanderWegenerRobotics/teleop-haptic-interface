device_id: 1

frame_rotation:
  - [-1,  0,  0]
  - [ 0, -1,  0]
  - [ 0,  0,  1]

motion_scaling: 4.0

control:
  stiffness: [50.0, 50.0, 50.0, 0.03, 0.03, 0.03]
  damping:   [ 7.0,  7.0,  7.0, 0.03, 0.03, 0.03]

passivity:
  max_damping_gain: 50.0

# Pure viscous damping applied in non-engaged state (zero-torque / floating feel).
# Passive by construction — only dissipates energy. Set 0 to disable.
# Typical useful range: 2–8 Ns/m linear, 0.01–0.05 Nm·s/rad angular.
idle_damping:
  linear:  0.0    # [Ns/m]   — enable for hardware: try 3.0
  angular: 0.0    # [Nms/rad] — enable for hardware: try 0.02

safety:
  max_force:       12.0
  max_torque:       0.5
  max_force_rate:  500.0
  max_torque_rate:  20.0
