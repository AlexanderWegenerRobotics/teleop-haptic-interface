session:
  log_dir: "log"
  mock_motion: false    # set true to use MockHapticDevice
  mock_profile: contact_z  # free_x = sine on X (pipeline test) | contact_z = sine on -Z + ±90° pitch (table contact test) | contact_z_down = same with fixed -90° pitch

avatar:
  remote_ip:    "127.0.0.1"
  send_port:    7000    # avatar listens here
  receive_port: 8000    # we listen here
  frequency:    20

