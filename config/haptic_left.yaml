device_id: 0

frame_rotation:
  - [-1,  0,  0]
  - [ 0, -1,  0]
  - [ 0,  0,  1]

motion_scaling: 4.0

control:
  stiffness: [50.0, 50.0, 50.0, 0.03, 0.03, 0.03]
  damping:   [ 7.0,  7.0,  7.0, 0.03, 0.03, 0.03]

# ------ Passivity controller ------
passivity:
  max_damping_gain: 50.0    # Ns/m

# ------ Safety limits ------
safety:
  max_force:       12.0   # N
  max_torque:       0.5   # Nm
  max_force_rate:  500.0  # N/s
  max_torque_rate:  20.0  # Nm/s
